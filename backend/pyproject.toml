[project]
name = "erp-backend"
version = "0.1.0"
description = "Equity research platform API (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "erp-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "structlog>=24.1",
    # M2 data ingestion (owner-approved 2026-11-06; purposes in DECISIONS.md D40)
    "httpx>=0.27",
    "procrastinate>=2.0",
    "duckdb>=1.0",
    "zstandard>=0.22",
]

[tool.uv.sources]
erp-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erp_backend"]
