# uv workspace root (virtual: not itself a package).
[tool.uv.workspace]
members = ["engine", "backend"]

[tool.uv]
# Reproducibility: resolve only releases published before this date (>= 2 weeks before
# the M0 date, 2026-11-06). Move forward deliberately, never implicitly.
exclude-newer = "2026-10-23T00:00:00Z"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "mpmath>=1.3",
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests
# Financial formulas in docstrings/comments use proper mathematical symbols.
allowed-confusables = ["−", "×", "–"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*" = ["S608"]
# Tests build SQL only from constant table names (S608).
"backend/tests/*" = ["S105", "S106", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["engine/src", "backend/src"]

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Independence of the reference valuation (Blueprint §13.1.1, D26). Run via `make lint`
# with engine/tests on PYTHONPATH so that `reference` is importable.
[tool.importlinter]
root_packages = ["reference", "erp_engine", "erp_backend"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Reference valuation is independent of the engine, backend and decimal arithmetic"
type = "forbidden"
source_modules = ["reference"]
forbidden_modules = ["erp_engine", "erp_backend", "decimal"]

[[tool.importlinter.contracts]]
name = "Engine never depends on test code"
type = "forbidden"
source_modules = ["erp_engine"]
forbidden_modules = ["reference"]

[[tool.importlinter.contracts]]
name = "Engine is independent of the backend"
type = "forbidden"
source_modules = ["erp_engine"]
forbidden_modules = ["erp_backend"]

[[tool.importlinter.contracts]]
name = "API process stays lean: no DuckDB in request-serving modules (D40)"
type = "forbidden"
source_modules = ["erp_backend.main", "erp_backend.api", "erp_backend.auth", "erp_backend.security"]
forbidden_modules = ["duckdb"]
