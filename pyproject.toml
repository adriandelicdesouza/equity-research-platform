# uv workspace root (virtual: not itself a package).
[tool.uv.workspace]
members = ["engine", "backend"]

[tool.uv]
# Reproducibility: resolve only releases published before this date (>= 2 weeks before
# the M0 date, 2026-11-06). Move forward deliberately, never implicitly.
exclude-newer = "2026-10-23T00:00:00Z"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*" = ["S608"]
"backend/tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["engine/src", "backend/src"]

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
